
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

<header class="header">
    <nav class="navbar">
        <a href="index.html" class="logo">● WERT Bank</a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>

            <li><a class="active" href="calculator.html">EMI Calculator</a></li>
            <li><a href="contact.html">Contact</a></li>

</header>

<section class="page-banner">
    <h1>EMI Calculator</h1>
    <p>Plan your loan payments with ease.</p>
</section>

<section class="calculator-section">

    <div class="calculator-box">

        <h2>Calculate Your EMI</h2>
        <p>Enter your loan details below.</p>

        <form id="emiForm">

            <label for="loanAmount">Loan Amount (₹)</label>
            <input type="number" id="loanAmount" placeholder="500000" min="1" required>

            <label for="interestRate">Annual Interest Rate (%)</label>
            <input type="number" id="interestRate" placeholder="8.5" min="0" step="0.01" required>

            <label for="loanYears">Loan Duration (Years)</label>
            <input type="number" id="loanYears" placeholder="5" min="1" required>

            <button type="submit" class="primary-btn">Calculate EMI</button>

        </form>

        <div id="emiResult" class="result-box">
            <h3>Your EMI Result</h3>
            <p>Enter your loan details to calculate EMI.</p>
        </div>

    </div>

</section>
