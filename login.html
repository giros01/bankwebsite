<section class="form-page">

    <div class="form-box">
        <div class="form-logo">● WERT Bank</div>

        <h1>Welcome Back</h1>
        <p>Login to your demo account</p>

        <form id="loginForm">

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required>

            <label for="password">Demo Access Code</label>
            <input type="password" id="password" placeholder="Enter demo code" required>

            <button type="submit" class="primary-btn">Demo Login</button>

        </form>

        <p id="loginMessage" class="message"></p>

        <p class="notice">
            This is an educational demo. Never enter real banking credentials.
        </p>
    </div>
